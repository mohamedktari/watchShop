<div class="flex min-h-screen items-center justify-center bg-brand-900 px-4">
  <div class="w-full max-w-sm rounded-2xl bg-white p-8 shadow-card-hover">
    <h1 class="mb-6 text-center text-xl font-bold text-brand-900">{{ 'admin.login.title' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">{{ 'admin.login.email' | translate }}</label>
        <input type="email" formControlName="email" class="w-full rounded-lg border-gray-300 focus:border-brand-500 focus:ring-brand-500" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">{{ 'admin.login.password' | translate }}</label>
        <input type="password" formControlName="password" class="w-full rounded-lg border-gray-300 focus:border-brand-500 focus:ring-brand-500" />
      </div>

      @if (error()) {
        <p class="text-sm text-red-600">{{ 'admin.login.error' | translate }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full rounded-full bg-brand-500 px-6 py-3 font-semibold text-white transition hover:bg-brand-600 disabled:opacity-60"
      >
        {{ 'admin.login.submit' | translate }}
      </button>
    </form>
  </div>
</div>
