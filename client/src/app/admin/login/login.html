<div class="flex min-h-screen items-center justify-center bg-brand-900 px-4">
  <div class="w-full max-w-sm animate-scale-in rounded-2xl bg-white p-8 shadow-card-hover">
    <h1 class="mb-6 text-center text-xl font-bold text-brand-900">{{ 'admin.login.title' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">{{ 'admin.login.email' | translate }}</label>
        <input type="email" formControlName="email" class="w-full rounded-lg border-gray-300 focus:border-violet-500 focus:ring-violet-500" />
      </div>

      <div>
        <label class="mb-1 block text-sm font-medium text-gray-700">{{ 'admin.login.password' | translate }}</label>
        <input type="password" formControlName="password" class="w-full rounded-lg border-gray-300 focus:border-violet-500 focus:ring-violet-500" />
      </div>

      @if (error()) {
        <p class="animate-fade-in text-sm text-red-600">{{ 'admin.login.error' | translate }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full transform-gpu rounded-full bg-lime-500 px-6 py-3 font-semibold text-brand-900 transition-all duration-200 hover:scale-[1.02] hover:bg-lime-600 hover:shadow-md active:scale-95 disabled:opacity-60 disabled:hover:scale-100"
      >
        {{ 'admin.login.submit' | translate }}
      </button>
    </form>
  </div>
</div>
